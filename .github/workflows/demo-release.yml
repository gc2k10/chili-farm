name: Prepare v0.1.0-demo draft
on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v0.1.0-demo.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prepare-v0.1.0-demo
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/demo-checks.yml
  draft:
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build allowlisted demo archive
        run: |
          python3 scripts/package-demo.py --source-commit "$GITHUB_SHA"
          python3 scripts/check-demo-package.py
          cd dist
          sha256sum *.zip > SHA256SUMS
      - name: Prepare draft without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp docs/releases/v0.1.0-demo.md "$RUNNER_TEMP/release-notes.md"
          printf '\n## Validation evidence\n\nSource commit: %s\n\nPassed browser checks and package verification: https://github.com/%s/actions/runs/%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/release-notes.md"
          if gh release view v0.1.0-demo --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view v0.1.0-demo --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release edit v0.1.0-demo --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload v0.1.0-demo dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          gh release create v0.1.0-demo dist/*.zip dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v0.1.0-demo — Standalone synthetic dashboard" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft --prerelease

name: Deploy frontend demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public demo assets
        run: |
          mkdir -p public-demo
          cp frontend/index.html frontend/style.css frontend/app.js frontend/about.html public-demo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public-demo
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
